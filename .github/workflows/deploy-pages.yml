name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PUSHED_AT: ${{ github.event.repository.pushed_at }}
          VITE_SONGBOOK_API: https://songbook.jorsanchezch.workers.dev
          # Public OAuth client IDs (PKCE). Secrets override when set.
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID != '' && secrets.VITE_SPOTIFY_CLIENT_ID || 'bfe45189360e48a2987fdae586883cd3' }}
          VITE_YOUTUBE_CLIENT_ID: ${{ secrets.VITE_YOUTUBE_CLIENT_ID != '' && secrets.VITE_YOUTUBE_CLIENT_ID || '1005651847868-k4oas55ikbu34alfcggqts39tel93j0r.apps.googleusercontent.com' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
